<!-- body.html is optional; elements will be added to your html body after app.js is loaded. -->

<a-scene
  landing-page
  vps-coaching-overlay
  xrextras-loading
  xrextras-runtime-error
  xrextras-gesture-detector
  renderer="colorManagement: true"
  xrweb="enableVps: true; allowedDevices: any"
  gltf-model="draco-decoder-path: https://cdn.8thwall.com/web/aframe/draco-decoder/"
  desktop-development>
  <a-assets>
    <!-- download the mesh from the geospatial browser and add it here -->
    <a-asset-item id="vps-mesh" src="assets/mission-rose.glb"></a-asset-item>
    <!-- if you have a prebaked animation that interacts with the mesh, add it here -->
    <a-asset-item id="abalone-shell" src="assets/abalone_shell.glb"></a-asset-item>
    <a-asset-item id="red-abalone-shell" src="assets/red_abalone_shell.glb"></a-asset-item>
  </a-assets>

  <a-camera
    position="0 2 2"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;"></a-camera>

  <!-- add a wayspot to the project from the geospatial browser
  and replace the name with the 'name' of the wayspot -->
  <a-entity named-wayspot="name: mission-rose">
    <a-entity gltf-model="#vps-mesh" hider-material></a-entity>
    <a-entity gltf-model="#vps-mesh" shadow-shader shadow="cast: false"></a-entity>

    <a-entity
      id="shell-1"
      gltf-model="#abalone-shell"
      position="1.151 0.427 -0.633"
      rotation="-83.826 128.963 138.450"
      scale="0.330 0.330 0.330"></a-entity>

    <a-entity
      id="shell-2"
      gltf-model="#abalone-shell"
      position="-0.838 0.427 1.057"
      rotation="-89.500 180.000 138.450"
      scale="0.330 0.330 0.330"></a-entity>

      <a-entity
      id="shell-3"
      gltf-model="#red-abalone-shell"
      position="1.556 0.380 -1.357"
      rotation="-68.937 -91.391 49.738"
      scale="0.006 0.006 0.006"></a-entity>

      <a-entity
      id="shell-4"
      gltf-model="#red-abalone-shell"
      position="-1.675 0.555 0.574"
      rotation="60.357 174.152 -164.007"
      scale="0.006 0.006 0.006"></a-entity>

      <a-entity
      id="shell-5"
      gltf-model="#red-abalone-shell"
      position="-0.267 0.495 -0.498"
      rotation="-72.058 177.000 83.194"
      scale="0.006 0.006 0.006"></a-entity>

  <!-- lights -->
  <a-entity
    light="
      type: directional;
      intensity: 0.8;
      castShadow: true;
      shadowMapHeight:2048;
      shadowMapWidth:2048;
      shadowCameraTop: 10;
      shadowCameraBottom: -10;
      shadowCameraRight: 10;
      shadowCameraLeft: -10;"
    position="0 10 -6"
    shadow>
  </a-entity>
  <a-light type="ambient" intensity="0.5"></a-light>
</a-scene>
